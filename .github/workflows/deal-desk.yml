name: deal-desk-floor

on:
  push:
    paths:
      - "skills/deal-desk/**"
      - ".github/workflows/deal-desk.yml"
  pull_request:
    paths:
      - "skills/deal-desk/**"
      - ".github/workflows/deal-desk.yml"

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: fail closed
        run: bash skills/deal-desk/scripts/eval.sh
